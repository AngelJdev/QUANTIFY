# ==============================================================================
# QUANTIFY — Configuracion Global de Pytest
# ==============================================================================
#
# Configuracion de pytest para todo el proyecto.
# Define opciones predeterminadas y rutas de busqueda de tests.
#
# Autor: Equipo QUANTIFY
# Fecha: Agosto 2026

[pytest]
testpaths = data/tests simulation/tests database/etl/tests models/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: Pruebas que toman mas de 10 segundos
    integration: Pruebas que requieren servicios externos
